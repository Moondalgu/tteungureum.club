<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url("https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css");
* { margin: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  position: relative;
  font-family: "Galmuri14", monospace;
  image-rendering: pixelated;
  -webkit-font-smoothing: none;
  background: linear-gradient(180deg, #7fccff 0%, #aae0ff 45%, #d7f2ff 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 서비스와 동일한 픽셀 구름 레이어 */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  image-rendering: pixelated;
  background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20xmlns:xlink='http://www.w3.org/1999/xlink'%20width='400'%20height='300'%20shape-rendering='crispEdges'%3E%3Cdefs%3E%3Cg%20id='a'%20fill='white'%3E%3Crect%20x='24'%20y='0'%20width='24'%20height='8'/%3E%3Crect%20x='8'%20y='8'%20width='48'%20height='8'/%3E%3Crect%20x='0'%20y='16'%20width='64'%20height='8'/%3E%3C/g%3E%3Cg%20id='b'%20fill='white'%3E%3Crect%20x='32'%20y='0'%20width='24'%20height='8'/%3E%3Crect%20x='16'%20y='8'%20width='56'%20height='8'/%3E%3Crect%20x='8'%20y='16'%20width='72'%20height='8'/%3E%3Crect%20x='0'%20y='24'%20width='88'%20height='8'/%3E%3C/g%3E%3Cg%20id='c'%20fill='white'%3E%3Crect%20x='52'%20y='0'%20width='16'%20height='8'/%3E%3Crect%20x='12'%20y='8'%20width='24'%20height='8'/%3E%3Crect%20x='46'%20y='8'%20width='28'%20height='8'/%3E%3Crect%20x='84'%20y='8'%20width='24'%20height='8'/%3E%3Crect%20x='8'%20y='16'%20width='32'%20height='8'/%3E%3Crect%20x='40'%20y='16'%20width='40'%20height='8'/%3E%3Crect%20x='80'%20y='16'%20width='32'%20height='8'/%3E%3Crect%20x='0'%20y='24'%20width='120'%20height='8'/%3E%3Crect%20x='8'%20y='32'%20width='104'%20height='8'/%3E%3C/g%3E%3Cg%20id='d'%20fill='white'%3E%3Crect%20x='16'%20y='0'%20width='40'%20height='8'/%3E%3Crect%20x='0'%20y='8'%20width='80'%20height='8'/%3E%3C/g%3E%3C/defs%3E%3Cuse%20xlink:href='%23c'%20transform='translate(-24,4)'/%3E%3Cuse%20xlink:href='%23a'%20transform='translate(168,22)'/%3E%3Cuse%20xlink:href='%23b'%20transform='translate(288,8)'/%3E%3Cuse%20xlink:href='%23d'%20transform='translate(70,84)'/%3E%3Cuse%20xlink:href='%23c'%20transform='translate(248,104)%20scale(0.8)'/%3E%3Cuse%20xlink:href='%23a'%20transform='translate(20,150)%20scale(1.1)'/%3E%3Cuse%20xlink:href='%23b'%20transform='translate(150,172)'/%3E%3Cuse%20xlink:href='%23d'%20transform='translate(296,196)%20scale(1.1)'/%3E%3Cuse%20xlink:href='%23a'%20transform='translate(110,238)'/%3E%3Cuse%20xlink:href='%23b'%20transform='translate(0,252)%20scale(0.9)'/%3E%3C/svg%3E");
  background-size: 800px 600px;
  background-repeat: repeat;
}
.wrap {
  position: relative;
  text-align: center;
}
/* 서비스 히어로 로고와 동일한 아웃라인 스타일 (2배 스케일) */
.logo {
  font-family: "Galmuri14", monospace;
  font-weight: 700;
  font-size: 120px; /* Galmuri14 x8 */
  line-height: 1.15;
  color: #fff;
  letter-spacing: 4px;
  text-shadow:
    7px 0 0 #21133a, -7px 0 0 #21133a,
    0 7px 0 #21133a, 0 -7px 0 #21133a,
    7px 7px 0 #21133a, -7px -7px 0 #21133a,
    7px -7px 0 #21133a, -7px 7px 0 #21133a,
    14px 20px 0 rgba(33, 19, 58, 0.22);
}
.tag {
  display: inline-block;
  margin-top: 44px;
  font-family: "Galmuri11", monospace;
  font-size: 36px; /* Galmuri11 x3 */
  color: #21133a;
  background: #fff;
  border: 7px solid #21133a;
  border-radius: 999px;
  padding: 14px 44px;
  box-shadow: 10px 10px 0 #21133a;
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">☁ 뜬구름클럽</div>
    <div class="tag">뜬구름 잡는 N들의 토론 클럽</div>
  </div>
</body>
</html>
