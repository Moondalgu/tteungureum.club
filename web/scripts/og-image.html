}
/* 서비스 히어로 로고와 동일한 아웃라인 스타일 (2배 스케일) */
.logo {
  font-family: "Galmuri14", monospace;
  font-weight: 700;
  font-size: 120px; /* Galmuri14 x8 */
  line-height: 1.15;
  color: #fff;
  letter-spacing: 4px;
  text-shadow:
    7px 0 0 #21133a, -7px 0 0 #21133a,
    0 7px 0 #21133a, 0 -7px 0 #21133a,
    7px 7px 0 #21133a, -7px -7px 0 #21133a,
    7px -7px 0 #21133a, -7px 7px 0 #21133a,
    14px 20px 0 rgba(33, 19, 58, 0.22);
}
.tag {
  display: inline-block;
  margin-top: 44px;
  font-family: "Galmuri11", monospace;
  font-size: 36px; /* Galmuri11 x3 */
  color: #21133a;
  background: #fff;
  border: 7px solid #21133a;
  border-radius: 999px;
  padding: 14px 44px;
  box-shadow: 10px 10px 0 #21133a;
}

<body>
  <div class="wrap">
